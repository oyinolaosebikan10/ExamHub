<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | ExamHub</title>

    <link rel="stylesheet" href="./css/login.css">
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <div class="brand">
                <div class="brand-mark">E</div>

                <div>
                    <h1>ExamHub</h1>
                    <p>Administration Portal</p>
                </div>
            </div>

            <div class="login-heading">
                <h2>Welcome back</h2>
                <p>Sign in to manage your examination platform.</p>
            </div>

            <form id="adminLoginForm" novalidate>

                <div id="loginError" class="form-message error" hidden></div>

                <div class="form-group">
                    <label for="email">Email address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="admin@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Show password"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >
                    <span id="loginButtonText">Sign in</span>
                    <span id="loginSpinner" class="spinner" hidden></span>
                </button>

            </form>

            <div class="login-footer">
                <a href="../index.html">← Back to ExamHub</a>
            </div>

        </section>

    </main>

    <script src="./js/login.js"></script>

</body>
</html>
